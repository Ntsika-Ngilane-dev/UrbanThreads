<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Urban Threads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Urban Threads home">
          <img src="assets/logo.svg" alt="Urban Threads logo" />
          <span>Urban Threads</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="login.html" class="nav-link active">Account</a>
        </nav>

        <div class="nav-actions">
          <a href="login.html" class="pill secondary" id="profile-link">Log In</a>
          <button type="button" class="pill secondary" id="logout-button" style="display: none;">Log Out</button>
          <a href="cart.html" class="cart-button" aria-label="Shopping cart">
            <span>Cart</span>
            <span id="cart-count-badge" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="auth-shell">
      <section class="container auth-grid">
        <div class="auth-visual">
          <div class="visual-panel">
            <span class="eyebrow">Your account</span>
            <h1>Built for daily rotation.</h1>
            <p>
              Keep your wishlist, saved cart, and new drops close at hand.
            </p>
            <ul class="auth-points">
              <li>Fast checkout</li>
              <li>Saved cart</li>
              <li>Streetwear updates</li>
            </ul>
          </div>
        </div>

        <div class="auth-panel">
          <div class="auth-toggle" role="tablist" aria-label="Authentication mode">
            <button class="mode-button active" type="button" data-mode="login">Sign In</button>
            <button class="mode-button" type="button" data-mode="signup">Create Account</button>
          </div>

          <form id="auth-form" class="auth-form">
            <div class="field-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="field-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="••••••••" required />
            </div>

            <button type="submit" id="submit-auth" class="primary-btn auth-submit">
              Continue
            </button>
          </form>

          <div class="divider"><span>or</span></div>

          <button id="google-signin" class="google-btn" type="button">
            <span class="google-mark">G</span>
            Continue with Google
          </button>

          <div id="auth-message" class="auth-message" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a href="index.html" class="brand footer-brand">
            <img src="assets/logo.svg" alt="Urban Threads logo" />
            <span>Urban Threads</span>
          </a>
        </div>
        <div class="footer-links">
          <a href="shop.html">Shop</a>
          <a href="login.html">Account</a>
          <a href="cart.html">Cart</a>
        </div>
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
