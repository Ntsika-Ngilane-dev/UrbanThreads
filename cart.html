<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Urban Threads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="cart">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Urban Threads home">
          <img src="assets/logo.svg" alt="Urban Threads logo" />
          <span>Urban Threads</span>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="login.html" class="nav-link">Account</a>
        </nav>

        <div class="nav-actions">
          <a href="login.html" class="pill secondary" id="profile-link">Log In</a>
          <button type="button" class="pill secondary" id="logout-button" style="display: none;">Log Out</button>
          <a href="cart.html" class="cart-button" aria-label="Shopping cart">
            <span>Cart</span>
            <span id="cart-count-badge" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell cart-page-shell">
      <section class="container cart-layout">
        <div class="cart-panel">
          <div class="section-heading compact">
            <span class="eyebrow">Cart</span>
            <h1>Your selection</h1>
          </div>
          <div id="cart-items" class="cart-items"></div>
        </div>

        <aside class="checkout-panel">
          <div class="section-heading compact">
            <span class="eyebrow">Summary</span>
            <h2>Checkout</h2>
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotal-value">R 0.00</strong>
          </div>
          <div class="summary-row">
            <span>Delivery</span>
            <strong id="shipping-value">R 0.00</strong>
          </div>
          <div class="summary-row total-row">
            <span>Total</span>
            <strong id="total-value">R 0.00</strong>
          </div>

          <button class="primary-btn checkout-btn" type="button">Proceed to checkout</button>
          <p id="cart-status" class="cart-status"></p>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a href="index.html" class="brand footer-brand">
            <img src="assets/logo.svg" alt="Urban Threads logo" />
            <span>Urban Threads</span>
          </a>
        </div>
        <div class="footer-links">
          <a href="shop.html">Shop</a>
          <a href="login.html">Account</a>
          <a href="cart.html">Cart</a>
        </div>
      </div>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
